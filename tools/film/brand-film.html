<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07090f}
#s{position:relative;width:1920px;height:1080px;overflow:hidden;background:#07090f;font-family:Outfit,sans-serif;color:#fff}
.sc{position:absolute;inset:0;overflow:hidden;display:none}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.t{position:absolute;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 56px;backface-visibility:hidden}
.t .k{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.t .w{font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-.01em;white-space:nowrap}
.t .s{font-weight:600;font-size:30px;line-height:1.2;margin-top:14px;opacity:.88}
.G{position:relative;display:inline-block}
.G .c{position:absolute;left:0;top:0;mix-blend-mode:screen;white-space:nowrap}
.bar{position:absolute;height:26px;background:rgba(255,255,255,.25);border-radius:13px;overflow:hidden}
.bar i{display:block;height:100%;background:#07090f;border-radius:13px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head><body><div id="s"><div id="root"></div><div class="flash" id="flash"></div></div>
<script>
const C={ink:'#07090f',cobalt:'#2f5bea',amber:'#f5a624',coral:'#ff5a36',violet:'#5b2bd6',paper:'#f3eee6',teal:'#22b8c4',rose:'#ff3d7f'};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-cl(x),4),ei=x=>Math.pow(cl(x),3),eio=x=>(x=cl(x),x<.5?8*x**4:1-Math.pow(-2*x+2,4)/2);
const hash=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
const root=document.getElementById('root');
const el=(tag,cls,css,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;return e;};
const ink=c=>[C.amber,C.paper,C.teal].includes(c)?C.ink:'#fff';
// a tile: colour block with an optional kicker, a big word and a subline
function tile(parent,{x,y,w,h,bg,k='',word='',size=96,sub='',align='left'}){const t=el('div','t',`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};color:${ink(bg)};text-align:${align};align-items:${align==='center'?'center':'flex-start'}`);
 if(k)t.appendChild(el('div','k','',k));if(word){const g=glyph(word,size);t.appendChild(g);t._g=g;}if(sub)t.appendChild(el('div','s','',sub));parent.appendChild(t);return t;}
// glitch word (white/ink text with red + cyan offsets)
function glyph(txt,size){const g=el('div','w G',`font-size:${size}px`);const r=el('span','c','color:#ff2a5f',txt),b=el('span','c','color:#22d3ff',txt),m=el('span','',`position:relative`,txt);g.append(r,b,m);g._r=r;g._b=b;g._m=m;return g;}
function glitch(g,t,t0,amp=26){if(!g)return;const k=seg(t,t0,t0+.4),a=(1-k)*amp*(hash(Math.floor(t*30))*.6+.4);g.style.opacity=t<t0?0:1;
 g._r.style.transform=`translate(${-a}px,0)`;g._b.style.transform=`translate(${a}px,0)`;g._r.style.opacity=g._b.style.opacity=(1-k)*.9;
 const sl=k<.85&&hash(Math.floor(t*25)+3)>.5,y=hash(Math.floor(t*25)+7)*80;g._m.style.clipPath=sl?`polygon(0 0,100% 0,100% ${y}%,0 ${y}%,0 ${y+12}%,100% ${y+12}%,100% 100%,0 100%)`:'none';
 g.style.transform=`scale(${1.18-.18*eo(seg(t,t0,t0+.2))})`;g.style.transformOrigin='left center';}
// entrance helpers
const flipIn=(t,el_,t0,d=.32)=>{const p=eo(seg(t,t0,t0+d));el_.style.transform=`perspective(1400px) rotateX(${(1-p)*-90}deg)`;el_.style.transformOrigin='50% 0';el_.style.opacity=p>0?1:0;};
const wipe=(t,el_,t0,dir='l',d=.35)=>{const p=eio(seg(t,t0,t0+d));const m={l:`inset(0 ${(1-p)*100}% 0 0)`,r:`inset(0 0 0 ${(1-p)*100}%)`,u:`inset(${(1-p)*100}% 0 0 0)`,d:`inset(0 0 ${(1-p)*100}% 0)`}[dir];el_.style.clipPath=m;};
const S=[];function scene(a,b,build){const n=el('div','sc');const cam=el('div','cam');n.appendChild(cam);root.appendChild(n);S.push({a,b,n,fn:build(cam)});}
// zoom-through: scale the camera so that rect (x,y,w,h) fills the frame
function dive(cam,t,t0,t1,r){const p=ei(seg(t,t0,t1));if(p<=0)return;const s=1+(1920/r.w-1)*p;const cx=r.x+r.w/2,cy=r.y+r.h/2;cam.style.transformOrigin=`${cx}px ${cy}px`;cam.style.transform=`translate(${(960-cx)*p}px,${(540-cy)*p}px) scale(${s})`;}

/* 1. 0-4s  The brief: a full grid of requests, then the real question */
scene(0,4,cam=>{const W=480,H=360;const req=[['01','More leads',C.coral],['02','More AI',C.cobalt],['03','A new website',C.violet],['04','More ads',C.amber],
 ['05','Automation',C.teal],['06','',C.ink],['07','A rebrand',C.rose],['08','More content',C.cobalt],['09','A new app',C.paper],['10','More traffic',C.coral],['11','Lower cost',C.violet],['12','Faster growth',C.amber]];
 under(cam,['#1b2550','#3a1c66','#5a1f22','#13343a'],W,H,12);const ts=req.map(([n,w,bg],i)=>tile(cam,{x:(i%4)*W,y:Math.floor(i/4)*H,w:W,h:H,bg,k:w?`Brief ${n}`:'',word:w,size:w.length>10?58:72}));
 const q=tile(cam,{x:W,y:H,w:W,h:H,bg:C.ink,k:'But first',word:'THE PROBLEM?',size:62});
 const head=el('div','t',`left:0;top:0;width:1920px;height:1080px;background:${C.ink};align-items:center;text-align:center;opacity:0`);const hg=glyph("WHAT'S THE<br><span style=\"color:#f5a624\">PROBLEM?</span>",250);head.appendChild(el('div','k','margin-bottom:24px','Those sound like solutions'));head.appendChild(hg);cam.parentNode.appendChild(head);
 return t=>{ts.forEach((x,i)=>{const d=[0,5,2,7,9,0,4,11,1,6,3,8][i]*.09;flipIn(t,x,d);glitch(x._g,t,d+.12,18);});
  flipIn(t,q,1.35);glitch(q._g,t,1.45,22);
  // the other requests strike through and dim while the real question holds
  ts.forEach((x,i)=>{if(i===5)return;const p=seg(t,2.0+i*.03,2.35+i*.03);x.style.filter=`saturate(${1-.85*p}) brightness(${1-.45*p})`;});
  dive(cam,t,2.55,3.15,{x:W,y:H,w:W,h:H});head.style.opacity=t>=3.1?1:0;glitch(hg,t,3.1,40);hg.style.transformOrigin='center';};});

/* 2. 4-8s  Where people pause: nine hesitation words fill the grid, dive into TRUST */
scene(4,8,cam=>{const W=640,H=360;const cells=[['Trust?','Is this safe?',C.cobalt],['Price?','Is it worth it?',C.amber],['Effort?','Too many steps',C.coral],['Risk?','What if it goes wrong?',C.violet],
 ['Where people pause','9 moments of doubt',C.ink],['Choice?','Which one is right?',C.teal],['Time?','Not now, maybe later',C.rose],['Habit?','The old way is easier',C.paper],['Proof?','Who else did this?',C.cobalt]];
 under(cam,['#13204d','#4a2a00','#4d1d12','#2a1460'],W,H,9);const ts=cells.map(([w,s,bg],i)=>tile(cam,{x:(i%3)*W,y:Math.floor(i/3)*H,w:W,h:H,bg,k:i===4?'':`Pause 0${i<4?i+1:i}`,word:w,size:i===4?54:104,sub:s}));
 return t=>{const L=t-4;cam.style.transform='none';
  ts.forEach((x,i)=>{const d=[4,0,1,2,3,5,6,7,8][i]*.24+.05;const dir='lrud'[i%4];wipe(L,x,d,dir,.3);glitch(x._g,L,d+.15,20);});
  dive(cam,L,3.25,3.95,{x:0,y:0,w:W,h:H});};});

/* 3. 8-10s  DOUBT: the moment a decision stalls */
scene(8,10,cam=>{const top=tile(cam,{x:0,y:0,w:1920,h:720,bg:C.cobalt,k:'Every decision has a moment of',word:'DOUBT',size:300});
 const l=tile(cam,{x:0,y:720,w:1280,h:360,bg:C.amber,k:'Checkout',word:'',sub:''});const bar=el('div','bar','left:56px;top:150px;width:1000px;background:rgba(7,9,15,.18)');const bi=el('i','');bar.appendChild(bi);l.appendChild(bar);
 const pct=el('div','w','position:absolute;left:1090px;top:118px;font-size:84px;color:#07090f','0%');l.appendChild(pct);
 const r=tile(cam,{x:1280,y:720,w:640,h:360,bg:C.ink,k:'Status',word:'PAUSED',size:96,sub:'The click that never comes'});
 return t=>{const L=t-8;wipe(L,top,0,'d',.3);glitch(top._g,L,.2,48);wipe(L,l,.35,'r',.3);wipe(L,r,.5,'l',.3);glitch(r._g,L,1.2,24);
  const p=87*eo(seg(L,.5,1.1));bi.style.width=p+'%';pct.textContent=Math.round(p)+'%';const blink=L>1.1&&Math.floor(L*4)%2;bi.style.opacity=blink?.55:1;
  cam.style.transform=`scale(${1+.03*seg(L,0,2)})`;};});

/* 4. 10-14s  The method on the beat: each step pushes the last one off */
scene(10,14,cam=>{const steps=[['01','OBSERVE','How people really decide','Interviews, journeys, behaviour data',C.coral,C.ink],['02','DIAGNOSE','The doubt that stops them','One pause, one cause',C.cobalt,C.amber],
 ['03','DESIGN','The fix, not the feature','Changes sized to the problem',C.violet,C.paper],['04','MEASURE','What actually moved','One behaviour, one baseline',C.amber,C.cobalt]];
 const frames=steps.map(([n,w,s,d,a,b])=>{const f=el('div','','position:absolute;inset:0');cam.appendChild(f);
  const A=tile(f,{x:0,y:0,w:1240,h:1080,bg:a,k:`Step ${n} / 04`,word:w,size:200,sub:s});const B=tile(f,{x:1240,y:0,w:680,h:540,bg:b,k:'How',word:'',sub:d});B.querySelector('.s').style.fontSize='44px';
  const Cn=tile(f,{x:1240,y:540,w:680,h:540,bg:C.ink,word:n,size:300});f._A=A;f._B=B;f._C=Cn;return f;});
 return t=>{const L=t-10,i=Math.min(3,Math.floor(L));frames.forEach((f,k)=>{f.style.display=k===i||k===i-1?'block':'none';});
  const l=L-i,p=eio(seg(l,0,.3));const f=frames[i];f.style.zIndex=2;f.style.transform=i?`translateX(${(1-p)*1920}px)`:'none';if(i)frames[i-1].style.transform=`translateX(${-p*600}px)`;
  glitch(f._A._g,l,.12,30);wipe(l,f._B,.22,'u',.3);wipe(l,f._C,.3,'d',.3);glitch(f._C._g,l,.35,20);};});

/* 5. 14-18s  Five industries, five different pauses */
scene(14,18,cam=>{const W=640,H=540;const ind=[['Retail','Doubt at checkout',C.coral],['Software','Fear of the wrong pick',C.cobalt],['Healthcare','Unsure what is next',C.teal],['Education','The risk of choosing wrong',C.violet],['Finance','Fear of regret',C.amber]];
 const pos=[[0,0,W,H],[W,0,W,H],[2*W,0,W,H],[0,H,W,H],[W,H,W,H]];
 under(cam,['#4d1d12','#13204d','#0f3a40','#2a1460','#4a2a00','#1b2550'],W,H,6);const ts=ind.map(([w,s,bg],i)=>tile(cam,{x:pos[i][0],y:pos[i][1],w:pos[i][2],h:pos[i][3],bg,k:`0${i+1} · Typical pause`,word:w,size:w.length>8?92:110,sub:s}));
 const end=tile(cam,{x:2*W,y:H,w:W,h:H,bg:C.ink,k:'Five industries',word:'ONE METHOD',size:84,sub:'Same science. Different pause.'});
 return t=>{const L=t-14;const sc=1.12-.12*eio(seg(L,0,.6));cam.style.transformOrigin='50% 50%';cam.style.transform=`scale(${sc})`;
  ts.forEach((x,i)=>{const d=.05+i*.22;flipIn(L,x,d,.3);glitch(x._g,L,d+.1,16);const v=.3+[0,.58,1.32,2.08,2.82][i];const on=Math.sin(Math.PI*seg(L,v,v+.7));x.style.filter=`brightness(${1+.18*on})`;if(L>=v)glitch(x._g,L,v,24);x._g.style.transform=`scale(${1+.08*on})`;});flipIn(L,end,1.15,.3);glitch(end._g,L,1.25,22);
  dive(cam,L,3.55,3.98,{x:2*W,y:H,w:W,h:H});};});

/* 6. 18-20.5s  Find the doubt. Remove it. */
scene(18,20.5,cam=>{const a=tile(cam,{x:0,y:0,w:1920,h:1080,bg:C.amber,align:'center',k:'Step one',word:'FIND THE <span class="dw" style="position:relative">DOUBT.</span>',size:190});
 const dw=a._g._m.querySelector('.dw');const strike=el('div','','position:absolute;left:-2%;top:46%;height:24px;background:#ff2a5f;width:0');dw.appendChild(strike);
 const b=tile(cam,{x:0,y:0,w:1920,h:1080,bg:C.ink,align:'center',k:'Step two',word:'REMOVE IT.',size:250});
 return t=>{const L=t-18;glitch(a._g,L,.05,30);a._g.style.transformOrigin='center';strike.style.width=`${eio(seg(L,.75,1.05))*104}%`;dw.style.opacity=1-.6*seg(L,1.0,1.15);
  wipe(L,b,1.15,'r',.3);b.style.display=L>=1.15?'flex':'none';glitch(b._g,L,1.3,46);b._g.style.transformOrigin='center';};});

/* 7. 20.5-23.5s  The call to action fills the frame */
scene(20.5,23.5,cam=>{const top=tile(cam,{x:0,y:0,w:1920,h:640,bg:C.cobalt,k:'Next step',word:'BOOK A DISCOVERY CALL',size:150});
 const c1=tile(cam,{x:0,y:640,w:640,h:440,bg:C.amber,k:'Who',word:'FOUNDERS',size:84,sub:'You speak with them'});
 const c2=tile(cam,{x:640,y:640,w:640,h:440,bg:C.coral,k:'Time',word:'15 MIN',size:110,sub:'No pitch deck'});
 const c3=tile(cam,{x:1280,y:640,w:640,h:440,bg:C.ink,k:'Where',word:'LONDON',size:84,sub:'and Bangalore'});
 return t=>{const L=t-20.5;wipe(L,top,0,'d',.3);glitch(top._g,L,.2,32);[c1,c2,c3].forEach((c,i)=>{flipIn(L,c,.7+i*.25,.3);glitch(c._g,L,.8+i*.25,20);});
  cam.style.transform=`scale(${1+.02*seg(L,0,3)})`;cam.style.opacity=1-seg(L,2.8,3);};});

/* 8. 23.5-27s  Logo */
scene(23.5,27,cam=>{const card=el('div','','position:absolute;inset:0;background:#f3eee6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px');cam.appendChild(card);
 const lg=el('img','','width:760px');lg.src='logo.webp';card.appendChild(lg);const u=el('div','t',`position:relative;background:none;color:#07090f;padding:0`);u.appendChild(el('div','k','font-size:26px;opacity:.7','cognexadigital.com · Book a discovery call'));card.appendChild(u);
 const bars=[C.coral,C.cobalt,C.amber,C.violet,C.teal].map((c,i)=>{const b=el('div','',`position:absolute;left:${i*384}px;top:0;width:384px;height:1080px;background:${c}`);cam.appendChild(b);return b;});
 return t=>{const L=t-23.5;bars.forEach((b,i)=>{const p=eio(seg(L,i*.05,.45+i*.05));b.style.transform=`translateY(${-p*1100}px)`;});
  lg.style.opacity=eo(seg(L,.4,.8));lg.style.transform=`scale(${1.06-.06*eo(seg(L,.4,1.4))})`;u.style.opacity=eo(seg(L,.9,1.3));};});

window.fitAll=function(){document.querySelectorAll('.sc').forEach(n=>n.style.display='block');
 document.querySelectorAll('.t').forEach(t=>{const avail=t.clientWidth-112;t.querySelectorAll(':scope > .w').forEach(g=>{let f=parseFloat(g.style.fontSize);while(g.scrollWidth>avail&&f>24){f-=2;g.style.fontSize=f+'px';}});});
 document.querySelectorAll('.sc').forEach(n=>n.style.display='none');};
function under(cam,cols,W,H,n){for(let i=0;i<n;i++){const c=cols[i%cols.length];cam.insertBefore(el('div','',`position:absolute;left:${(i%Math.round(1920/W))*W}px;top:${Math.floor(i/Math.round(1920/W))*H}px;width:${W}px;height:${H}px;background:${c}`),cam.firstChild);}}
window.TOTAL=27;
window.render=function(t){let f=0;for(const s of S){if(s.a>0&&Math.abs(t-s.a)<.05)f=Math.max(f,.45*(1-Math.abs(t-s.a)/.05));}
 for(const s of S){const on=t>=s.a&&t<s.b;s.n.style.display=on?'block':'none';if(on)s.fn(t);}document.getElementById('flash').style.opacity=f;};
render(0);
</script></body></html>
